<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Skyward MP peer (dev harness)</title>
  </head>
  <body>
    <script type="module">
      // Dev-only multiplayer peer used by mp-selftest.html. Joins a room
      // via the real /multiplayer/net.js and reports every milestone to
      // the parent frame so a trial can be scored automatically.
      // NOTE: the import must be dynamic with @vite-ignore — Vite's dev
      // server refuses static JS imports of files inside /public.
      let Net;
      try {
        const NET_URL = "/multiplayer/net.js";
        const m = await import(/* @vite-ignore */ NET_URL);
        Net = m.Net;
      } catch (e) {
        document.body.innerHTML = "harness failed to load net.js: " + e.message;
        throw e;
      }

      const params = new URLSearchParams(location.search);
      const room = params.get("room");
      const label = params.get("label") || "peer";
      const t0 = performance.now();
      const standalone = window.parent === window;
      const send = (msg) => {
        if (!standalone) parent.postMessage({ from: label, ...msg }, "*");
        // Also render standalone so the page can be debugged directly.
        if (standalone) {
          const el = document.getElementById("out") || (() => {
            const d = document.createElement("pre");
            d.id = "out";
            document.body.appendChild(d);
            return d;
          })();
          el.textContent += `\n${msg.kind}: ${JSON.stringify(msg)}`;
        }
      };
      const ms = () => Math.round(performance.now() - t0);

      const net = new Net();
      let hellos = 0;
      net
        .on("onStatus", (status, error) => send({ kind: "status", status, error: error || null, ms: ms() }))
        .on("onPeerJoin", () => send({ kind: "join", ms: ms() }))
        .on("onPeerLeave", () => send({ kind: "leave", ms: ms() }))
        .on("onHello", () => { hellos++; send({ kind: "hello", ms: ms(), hellos }); })
        .on("onSpawn", () => send({ kind: "data-recv", ms: ms() }));

      // Report peer count AND the hello counter periodically: a runaway
      // hello counter proves an echo storm between peers.
      setInterval(() => {
        send({ kind: "peers", count: net.peerCount(), hellos, ms: ms() });
      }, 2000);

      net.connect(room, label).then((ok) => {
        send({ kind: "connect-result", ok, error: net.error || null, ms: ms() });
      });

      window.addEventListener("message", (e) => {
        const d = e.data;
        if (d === "leave") {
          net.leave();
        } else if (d && d.kind === "probe") {
          // Send a spawn-presence packet (no rate limiting) and let the
          // other peer confirm it arrived: proves the data channel works.
          net.broadcastSpawn({ placed: 1, lon: -117.9, lat: 33.8, camLon: -117.9, camLat: 33.8 });
          send({ kind: "data-sent", ms: ms() });
        }
      });
    </script>
  </body>
</html>
