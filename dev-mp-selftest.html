<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Skyward multiplayer self-test</title>
    <style>
      body { background: #08121c; color: #b9ffd9; font: 13px Consolas, monospace; padding: 16px; }
      #out { white-space: pre-wrap; line-height: 1.5; }
      .pass { color: #5f5; }
      .fail { color: #f66; }
      .info { color: #9cf; }
      h1 { font-size: 15px; letter-spacing: 2px; color: #0fe; }
    </style>
  </head>
  <body>
    <h1>SKYWARD MULTIPLAYER CONNECTION SELF-TEST</h1>
    <div id="out">starting…</div>
    <div id="frames"></div>
    <script>
      // Dev-only harness: runs N independent connection trials in isolated
      // iframes (separate JS contexts => separate Trystero identities),
      // scoring connect time and verifying the data channel end to end.
      const TRIALS = Number(new URLSearchParams(location.search).get("trials") || 4);
      const TIMEOUT_MS = Number(new URLSearchParams(location.search).get("timeout") || 25000);
      const out = document.getElementById("out");
      const frames = document.getElementById("frames");
      const results = [];
      let lines = [];

      function log(text, cls) {
        lines.push(cls ? `<span class="${cls}">${text}</span>` : text);
        out.innerHTML = lines.join("\n");
      }
      function randCode() {
        const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let s = "";
        for (let i = 0; i < 6; i++) s += A[Math.floor(Math.random() * A.length)];
        return s;
      }

      function runTrial(index) {
        return new Promise((resolve) => {
          const room = randCode();
          const state = { A: {}, B: {} };
          const started = performance.now();
          let done = false;
          const ifrA = document.createElement("iframe");
          const ifrB = document.createElement("iframe");
          ifrA.width = ifrB.width = 220;
          ifrA.height = ifrB.height = 40;
          const cleanup = () => {
            window.removeEventListener("message", onMsg);
            clearTimeout(timer);
            try { ifrA.contentWindow.postMessage("leave", "*"); } catch (e) {}
            try { ifrB.contentWindow.postMessage("leave", "*"); } catch (e) {}
            setTimeout(() => { ifrA.remove(); ifrB.remove(); }, 300);
          };
          const finish = (record) => {
            if (done) return;
            done = true;
            cleanup();
            resolve(record);
          };

          const onMsg = (e) => {
            const d = e.data;
            if (!d || !d.from) return;
            state[d.from][d.kind] = d;
            if (d.kind === "status" && d.status === "error") {
              finish({ room, ok: false, reason: "status error: " + d.error, ms: Date.now() - started });
              return;
            }
            // Connected when BOTH sides saw the peer join.
            if (state.A.join && state.B.join) {
              // Prove the data channel: probe A, expect B to receive.
              ifrA.contentWindow.postMessage({ kind: "probe" }, "*");
              const probeStart = Date.now();
              const waitData = setInterval(() => {
                if (state.B["data-recv"]) {
                  clearInterval(waitData);
                  finish({
                    room, ok: true,
                    ms: Date.now() - started,
                    connectMs: Math.max(state.A.join.ms, state.B.join.ms),
                    dataMs: Date.now() - probeStart,
                  });
                } else if (Date.now() - probeStart > 6000) {
                  clearInterval(waitData);
                  finish({
                    room, ok: true,
                    ms: Date.now() - started,
                    connectMs: Math.max(state.A.join.ms, state.B.join.ms),
                    dataMs: null,
                    reason: "connected but data probe did not arrive",
                  });
                }
              }, 100);
            }
          };

          window.addEventListener("message", onMsg);
          ifrA.src = "/dev-mp-peer.html?room=" + room + "&label=A";
          ifrB.src = "/dev-mp-peer.html?room=" + room + "&label=B";
          frames.appendChild(ifrA);
          frames.appendChild(ifrB);

          const timer = setTimeout(() => {
            finish({
              room, ok: false, ms: Date.now() - started, connectMs: null,
              reason: "timeout waiting for peer join (" +
                (state.A.join ? "A ok" : "A missing") + ", " +
                (state.B.join ? "B ok" : "B missing") + ")",
            });
          }, TIMEOUT_MS);
        });
      }

      (async () => {
        lines = [];
        log("Running " + TRIALS + " trials, " + TIMEOUT_MS + "ms timeout each\n", "info");
        let pass = 0, dataPass = 0;
        const connectTimes = [];
        for (let i = 1; i <= TRIALS; i++) {
          log("Trial " + i + " …", "info");
          const r = await runTrial(i - 1);
          results.push(r);
          if (r.ok) {
            pass++;
            connectTimes.push(r.connectMs);
            if (r.dataMs != null) dataPass++;
          }
          log(
            "Trial " + i + ": " + (r.ok ? "PASS" : "FAIL") +
            "  connect=" + (r.connectMs != null ? r.connectMs + "ms" : "-") +
            "  data=" + (r.dataMs != null ? r.dataMs + "ms" : (r.ok ? "MISSING" : "-")) +
            (r.reason ? "  [" + r.reason + "]" : ""),
            r.ok ? "pass" : "fail"
          );
        }
        const avg = connectTimes.length
          ? Math.round(connectTimes.reduce((a, b) => a + b, 0) / connectTimes.length)
          : 0;
        log(
          "\nSUMMARY\n" +
          "connections: " + pass + "/" + TRIALS + (pass === TRIALS ? "  ALL CONNECTED" : "  *** FAILURES ***") + "\n" +
          "data channel: " + dataPass + "/" + TRIALS + (dataPass === TRIALS ? "  ALL VERIFIED" : "  *** GAPS ***") + "\n" +
          "avg connect: " + avg + "ms\n" +
          "SELFTEST_DONE pass=" + pass + " total=" + TRIALS + " data=" + dataPass + " avg=" + avg,
          pass === TRIALS && dataPass === TRIALS ? "pass" : "fail"
        );
      })();
    </script>
  </body>
</html>
