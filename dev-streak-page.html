<!doctype html>
<html>
<head><meta charset="utf-8"/></head>
<body>
<script type="module">
  // Isolated probe: does the Bullet streak material/geometry render at all,
  // with a fake identity viewMatrix (camera at world origin looking -Z)?
  import * as THREE from "/node_modules/three/build/three.module.js";
  import * as Cesium from "/node_modules/cesium/Build/Cesium/index.js";
  import { Bullet } from "/src/weapon/bullet.js";

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, 812 / 375, 0.1, 100000);
  camera.position.set(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, premultipliedAlpha: false });
  renderer.setSize(812, 375);
  document.body.appendChild(renderer.domElement);

  const fakeViewer = {
    camera: {
      viewMatrix: Cesium.Matrix4.clone(Cesium.Matrix4.IDENTITY),
      positionWC: new Cesium.Cartesian3(0, 0, 0),
    },
    scene: { globe: { getHeight: () => undefined } },
  };

  // Camera at world origin; viewMatrix identity => camera space == world.
  // Fire from (0,0,0) heading 0 pitch 0 -> bullet steps to z=-speed*dt.
  const b = new Bullet(scene, fakeViewer, { lon: 0, lat: 0, alt: 0 }, 0, 0, 10);
  window.bullet = b;

  let frames = 0;
  renderer.setAnimationLoop(() => {
    b.update(1 / 60);
    renderer.render(scene, camera);
    if (++frames === 30) {
      // stop the world motion so the streak sits at a known z, then report
      b.life = 999;
      window.READY = true;
    }
  });

  window.check = () => {
    const m = b.mesh.matrix.elements;
    return {
      pos: [m[12], m[13], m[14]].map((v) => +v.toFixed(1)),
      inScene: !!b.mesh.parent,
      visible: b.mesh.visible,
      children: b.mesh.children.length,
    };
  };
</script>
</body>
</html>
